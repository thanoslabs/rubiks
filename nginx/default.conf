server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Relative Location headers, so directory redirects work behind any port mapping or proxy.
    absolute_redirect off;

    include /etc/nginx/conf.d/security-headers.inc;

    location / {
        try_files $uri $uri/ =404;
    }

    # Always revalidate HTML so new releases are picked up immediately.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
}
