# Included in every location that sets its own headers (nginx drops inherited
# add_header directives when a block adds any of its own).
# The app is fully self-contained: no CDNs, no external requests.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
