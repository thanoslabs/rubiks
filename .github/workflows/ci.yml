name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          # Fail if .env, secrets, or private keys are committed
          if git grep -l "\.env\|PRIVATE_KEY\|AWS_SECRET" --cached 2>/dev/null; then
            echo "Error: sensitive files committed"
            exit 1
          fi

      - name: Validate YAML files
        run: |
          for f in $(find . -name "*.yaml" -o -name "*.yml" 2>/dev/null | grep -v node_modules); do
            python3 -c "import yaml, sys; yaml.safe_load(open('$f'))" 2>/dev/null || echo "Invalid YAML: $f"
          done

      # setup-node's own .tool-versions parsing picks up comment lines, so
      # read the pinned version explicitly.
      - name: Read pinned Node version
        id: node
        run: echo "version=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Run unit tests
        run: npm test

      # Add project-specific validation steps below, e.g.:
      # - name: Run tests
      #   run: go test ./...
      #
      # - name: Build Docker image
      #   run: docker build .

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t rubiks:ci .

      - name: Smoke test image
        run: |
          set -euo pipefail
          docker run -d --name rubiks -p 8080:8080 rubiks:ci
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 0.5; done
          curl -fsS http://localhost:8080/ | grep -q "<title>Rubik's Cube</title>"
          curl -fsS -o /dev/null http://localhost:8080/js/main.js
          curl -fsSI http://localhost:8080/ | grep -qi '^content-security-policy:'
          test "$(docker exec rubiks id -u)" != "0"
